# Only the web interface (port 8001) is reachable from other machines. The database, RabbitMQ,
# the backend API and Adminer listen on 127.0.0.1, i.e. on this host only; the containers reach
# each other over the Compose network. Adminer starts only with: docker compose --profile admin up -d

services:
  # ── Infrastructure ───────────────────────────────────────────────────────────

  db:
    image: postgres:15
    container_name: fastapi_gateway_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fastapi_gateway_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  adminer:
    image: adminer
    container_name: fastapi_gateway_adminer
    restart: always
    profiles: ["admin"]   # direct database access: off unless started with --profile admin
    ports:
      - "127.0.0.1:8090:8080" # moved to 8090 — port 8080 is reserved for kubectl port-forward
    depends_on:
      - db

  rabbitmq:
    image: rabbitmq:3-management
    container_name: fastapi_gateway_rabbitmq
    restart: always
    environment:
      # A pipeline message is acked only when its checksum/upload finishes, which can take
      # hours. RabbitMQ's default 30 min ack timeout would close the channel mid-upload and
      # crash the worker, so allow 7 days.
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-rabbit consumer_timeout 604800000"
    ports:
      - "127.0.0.1:5672:5672" # AMQP protocol (used by pika)
      - "127.0.0.1:15672:15672" # Management UI → http://localhost:15672  (guest/guest), this host only
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Application ──────────────────────────────────────────────────────────────

  backend:
    build:
      context: ./backend
    container_name: fastapi_gateway_backend
    restart: always
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "127.0.0.1:8000:8000"   # API for the frontend; every endpoint except /auth needs a login token
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USERNAME: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fastapi_gateway_db
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      LOG_LEVEL: DEBUG
    depends_on:
      - db
      - rabbitmq
    volumes:
      - ./backend:/app
      # ── Sequencer machine output folders ──────────────────────────────────────
      # Add one line per machine: left side = real path on this machine (host)
      #                           right side = path inside container (always /runs/...)
      # Linux/Mac example:  - /data/illumina/outputs:/runs/machine-1
      # Windows example:    - C:\Sequencer\Illumina:/runs/machine-1
      - ${MACHINE_1_PATH}:/runs/machine-1
      # - ${MACHINE_1_PATH_SHARED}:/runs/machine-1-shared
      # ── Docker socket (required for container management API) ──────────────────
      # Linux / macOS:
      - /var/run/docker.sock:/var/run/docker.sock
      # Windows (Docker Desktop) — comment out the line above and uncomment this:
      # - //var/run/docker.sock:/var/run/docker.sock

  frontend:
    build:
      context: ./frontend
    container_name: fastapi_gateway_frontend
    restart: always
    command: uvicorn main:app --host 0.0.0.0 --port 8001 --reload
    ports:
      - "8001:8001"
    environment:
      BACKEND_URL: http://backend:8000
      LOG_LEVEL: DEBUG
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      # ── Repo root (required for one-click update feature) ──────────────────────
      - .:/workspace
      # ── Docker socket (required for container management UI) ───────────────────
      # Linux / macOS:
      - /var/run/docker.sock:/var/run/docker.sock
      # Windows (Docker Desktop) — comment out the line above and uncomment this:
      # - //var/run/docker.sock:/var/run/docker.sock

  worker:
    build:
      context: ./backend
    container_name: fastapi_gateway_worker
    restart: always
    command: python services/worker.py
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USERNAME: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fastapi_gateway_db
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      LOG_LEVEL: DEBUG
    depends_on:
      db:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ${MACHINE_1_PATH}:/runs/machine-1
      # - ${MACHINE_1_PATH_SHARED}:/runs/machine-1-shared

  watcher:
    build:
      context: ./backend
    container_name: fastapi_gateway_watcher
    restart: always
    command: python services/watcher.py
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USERNAME: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fastapi_gateway_db
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      LOG_LEVEL: DEBUG
    depends_on:
      db:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ${MACHINE_1_PATH}:/runs/machine-1
      # - ${MACHINE_1_PATH_SHARED}:/runs/machine-1-shared

  backup:
    build:
      context: ./backend
    container_name: fastapi_gateway_backup
    restart: always
    command: python services/backup.py
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USERNAME: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fastapi_gateway_db
      LOG_LEVEL: DEBUG
    depends_on:
      db:
        condition: service_started
    volumes:
      - ./backend:/app
      - ./backups:/app/backups

volumes:
  postgres_data:
