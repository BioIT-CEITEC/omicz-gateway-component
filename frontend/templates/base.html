<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/static/images/fav.png" />
    <title>{% block title %}OmiCZ GateWay{% endblock %}</title>
    <script>
      // Apply the theme before first paint: saved choice, otherwise the system setting.
      (function () {
        var saved = null;
        try { saved = localStorage.getItem('theme'); } catch (e) {}
        var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.classList.toggle('dark', dark);
      })();
    </script>
    <link rel="stylesheet" href="/static/css/dark.css" />
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-[#F0F4FA] text-gray-800 flex min-h-screen">

    {# Top bar with menu button below the lg breakpoint, where the sidebar slides in #}
    <div class="lg:hidden fixed top-0 inset-x-0 h-14 bg-white border-b border-gray-100 z-40 flex items-center gap-3 px-4 shadow-sm">
      <button type="button" onclick="openSidebar()" aria-label="Open menu" aria-controls="sidebar"
              class="-ml-1 p-2 rounded-md text-gray-500 hover:text-gray-900 hover:bg-gray-50">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5"/></svg>
      </button>
      <a href="/" class="block w-28">{% with logo_id = "topbar" %}{% include "partials/logo.html" %}{% endwith %}</a>
    </div>
    <div id="sidebar-backdrop" onclick="closeSidebar()" class="hidden lg:hidden fixed inset-0 bg-black/40 z-40"></div>

    {% include "partials/header.html" %}

    <main class="lg:ml-48 flex-1 min-w-0 px-4 sm:px-6 lg:px-8 pt-20 pb-8 lg:py-8 min-h-screen lg:max-w-[calc(100vw-12rem)]">
      {% block content %}{% endblock %}
    </main>

    {% block scripts %}{% endblock %}

    <script>
      // Theme toggle (sidebar). Without a saved choice the page follows the system setting.
      function setTheme(dark, save) {
        document.documentElement.classList.toggle('dark', dark);
        if (save) { try { localStorage.setItem('theme', dark ? 'dark' : 'light'); } catch (e) {} }
        var label = document.getElementById('theme-toggle-label');
        if (label) label.textContent = dark ? 'Light mode' : 'Dark mode';
        document.querySelectorAll('[data-theme-icon]').forEach(function (el) {
          el.classList.toggle('hidden', el.dataset.themeIcon !== (dark ? 'sun' : 'moon'));
        });
      }
      // Sidebar as a slide-in menu on small screens
      function openSidebar() {
        document.getElementById('sidebar').classList.remove('-translate-x-full');
        document.getElementById('sidebar-backdrop').classList.remove('hidden');
      }
      function closeSidebar() {
        document.getElementById('sidebar').classList.add('-translate-x-full');
        document.getElementById('sidebar-backdrop').classList.add('hidden');
      }
      document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeSidebar(); });
      function toggleTheme() {
        setTheme(!document.documentElement.classList.contains('dark'), true);
        location.reload();  // charts read the theme when they are drawn
      }
      setTheme(document.documentElement.classList.contains('dark'), false);
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function (e) {
        var saved = null;
        try { saved = localStorage.getItem('theme'); } catch (err) {}
        if (!saved) setTheme(e.matches, false);
      });
    </script>

    <script>
      // Clear any stale localStorage keys from old implementation
      localStorage.removeItem('update_available');
      localStorage.removeItem('latest_version');
      localStorage.removeItem('update_check_time');

      // Check for updates on every page load. Server caches GitHub result for 5 min.
      fetch('/system/version')
        .then(function(r) { return r.json(); })
        .then(function(data) {
          var dot    = document.getElementById('update-dot');
          var badge  = document.getElementById('version-badge-link');
          var banner = document.getElementById('update-available-banner');
          var msg    = document.getElementById('update-available-msg');
          if (data.update_available) {
            if (dot)   dot.classList.remove('hidden');
            if (badge) badge.title = 'Update available: v' + data.latest + ' — click to update';
            if (banner) {
              if (msg) msg.textContent = 'Version ' + data.latest + ' is available.';
              banner.classList.remove('hidden');
            }
          } else {
            if (dot)    dot.classList.add('hidden');
            if (banner) banner.classList.add('hidden');
          }
        })
        .catch(function() {});
    </script>
  </body>
</html>
