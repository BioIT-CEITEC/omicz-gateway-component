<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/static/images/fav.png" />
    <title>{% block title %}OmiCZ GateWay{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-[#F0F4FA] text-gray-800 flex min-h-screen">

    {% include "partials/header.html" %}

    <main class="ml-48 flex-1 px-8 py-8 min-h-screen max-w-[calc(100vw-12rem)]">
      {% block content %}{% endblock %}
    </main>

    {% block scripts %}{% endblock %}

    <script>
      // Show update dot in sidebar on every page if a pending update was detected
      if (localStorage.getItem('update_available') === 'true') {
        var dot = document.getElementById('update-dot');
        if (dot) dot.classList.remove('hidden');
      }
    </script>
  </body>
</html>
