<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/static/images/fav.png" />
    <title>{% block title %}OmiCZ GateWay{% endblock %}</title>
    <script>
      // Apply the theme before first paint: saved choice, otherwise the system setting.
      (function () {
        var saved = null;
        try { saved = localStorage.getItem('theme'); } catch (e) {}
        var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.classList.toggle('dark', dark);
      })();
    </script>
    <link rel="stylesheet" href="/static/css/dark.css" />
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-[#F0F4FA] text-gray-800 flex min-h-screen">

    {% include "partials/header.html" %}

    <main class="ml-48 flex-1 px-8 py-8 min-h-screen max-w-[calc(100vw-12rem)]">
      {% block content %}{% endblock %}
    </main>

    {% block scripts %}{% endblock %}

    <script>
      // Theme toggle (sidebar). Without a saved choice the page follows the system setting.
      function setTheme(dark, save) {
        document.documentElement.classList.toggle('dark', dark);
        if (save) { try { localStorage.setItem('theme', dark ? 'dark' : 'light'); } catch (e) {} }
        var label = document.getElementById('theme-toggle-label');
        if (label) label.textContent = dark ? 'Light mode' : 'Dark mode';
        document.querySelectorAll('[data-theme-icon]').forEach(function (el) {
          el.classList.toggle('hidden', el.dataset.themeIcon !== (dark ? 'sun' : 'moon'));
        });
      }
      function toggleTheme() {
        setTheme(!document.documentElement.classList.contains('dark'), true);
        location.reload();  // charts read the theme when they are drawn
      }
      setTheme(document.documentElement.classList.contains('dark'), false);
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function (e) {
        var saved = null;
        try { saved = localStorage.getItem('theme'); } catch (err) {}
        if (!saved) setTheme(e.matches, false);
      });
    </script>

    <script>
      // Clear any stale localStorage keys from old implementation
      localStorage.removeItem('update_available');
      localStorage.removeItem('latest_version');
      localStorage.removeItem('update_check_time');

      // Check for updates on every page load. Server caches GitHub result for 5 min.
      fetch('/system/version')
        .then(function(r) { return r.json(); })
        .then(function(data) {
          var dot    = document.getElementById('update-dot');
          var badge  = document.getElementById('version-badge-link');
          var banner = document.getElementById('update-available-banner');
          var msg    = document.getElementById('update-available-msg');
          if (data.update_available) {
            if (dot)   dot.classList.remove('hidden');
            if (badge) badge.title = 'Update available: v' + data.latest + ' — click to update';
            if (banner) {
              if (msg) msg.textContent = 'Version ' + data.latest + ' is available.';
              banner.classList.remove('hidden');
            }
          } else {
            if (dot)    dot.classList.add('hidden');
            if (banner) banner.classList.add('hidden');
          }
        })
        .catch(function() {});
    </script>
  </body>
</html>
