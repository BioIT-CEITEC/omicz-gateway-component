<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/static/images/fav.png" />
    <title>{% block title %}OmiCZ GateWay{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-[#F0F4FA] text-gray-800 flex min-h-screen">

    {% include "partials/header.html" %}

    <main class="ml-48 flex-1 px-8 py-8 min-h-screen max-w-[calc(100vw-12rem)]">
      {% block content %}{% endblock %}
    </main>

    {% block scripts %}{% endblock %}

    <script>
      // Show update dot immediately from cached state (before fetch completes)
      if (localStorage.getItem('update_available') === 'true') {
        var dot = document.getElementById('update-dot');
        if (dot) {
          dot.classList.remove('hidden');
          var latest = localStorage.getItem('latest_version');
          var badge = document.getElementById('version-badge-link');
          if (badge && latest) badge.title = 'Update available: v' + latest + ' — click to update';
        }
        var banner = document.getElementById('update-available-banner');
        if (banner) {
          var latest = localStorage.getItem('latest_version');
          var msg = document.getElementById('update-available-msg');
          if (msg && latest) msg.textContent = 'Version ' + latest + ' is available.';
          banner.classList.remove('hidden');
        }
      }

      // Background version check — runs at most once per hour across all pages
      (function() {
        var CHECK_INTERVAL_MS = 60 * 60 * 1000;
        var lastCheck = parseInt(localStorage.getItem('update_check_time') || '0');
        if (Date.now() - lastCheck < CHECK_INTERVAL_MS) return;
        fetch('/system/version')
          .then(function(r) { return r.json(); })
          .then(function(data) {
            localStorage.setItem('update_check_time', Date.now());
            if (data.update_available) {
              localStorage.setItem('update_available', 'true');
              localStorage.setItem('latest_version', data.latest);
              var dot = document.getElementById('update-dot');
              if (dot) dot.classList.remove('hidden');
              var badge = document.getElementById('version-badge-link');
              if (badge) badge.title = 'Update available: v' + data.latest + ' — click to update';
              var banner = document.getElementById('update-available-banner');
              if (banner) {
                var msg = document.getElementById('update-available-msg');
                if (msg) msg.textContent = 'Version ' + data.latest + ' is available.';
                banner.classList.remove('hidden');
              }
            } else if (data.latest) {
              localStorage.removeItem('update_available');
              localStorage.removeItem('latest_version');
              var dot = document.getElementById('update-dot');
              if (dot) dot.classList.add('hidden');
            }
          })
          .catch(function() {});
      })();
    </script>
  </body>
</html>
