{% extends "base.html" %}
{% block title %}Home — OmiCZ GateWay{% endblock %}
{% block content %}
<div class="pt-12">
  <h1 class="text-2xl font-bold text-gray-900 mb-1">Dashboard</h1>
  <p class="text-sm text-gray-400 mb-10">Sequencer data pipeline management</p>

  <div class="grid grid-cols-3 gap-4 max-w-2xl">
    <a href="/runs"
       class="bg-white rounded-xl shadow-sm border border-gray-100 px-5 py-4 hover:shadow-md hover:border-[#0C2461]/20 transition group">
      <p class="text-xs text-gray-400 uppercase tracking-wide mb-1">Pipeline</p>
      <p class="text-sm font-semibold text-gray-900 group-hover:text-[#0C2461]">Runs</p>
    </a>
    <a href="/runs/queue/view"
       class="bg-white rounded-xl shadow-sm border border-gray-100 px-5 py-4 hover:shadow-md hover:border-[#0C2461]/20 transition group">
      <p class="text-xs text-gray-400 uppercase tracking-wide mb-1">Pipeline</p>
      <p class="text-sm font-semibold text-gray-900 group-hover:text-[#0C2461]">Queue</p>
    </a>
    <a href="/sequencers"
       class="bg-white rounded-xl shadow-sm border border-gray-100 px-5 py-4 hover:shadow-md hover:border-[#0C2461]/20 transition group">
      <p class="text-xs text-gray-400 uppercase tracking-wide mb-1">Config</p>
      <p class="text-sm font-semibold text-gray-900 group-hover:text-[#0C2461]">Sequencers</p>
    </a>
    <a href="/logs/"
       class="bg-white rounded-xl shadow-sm border border-gray-100 px-5 py-4 hover:shadow-md hover:border-[#0C2461]/20 transition group">
      <p class="text-xs text-gray-400 uppercase tracking-wide mb-1">System</p>
      <p class="text-sm font-semibold text-gray-900 group-hover:text-[#0C2461]">Logs</p>
    </a>
    <a href="/settings/"
       class="bg-white rounded-xl shadow-sm border border-gray-100 px-5 py-4 hover:shadow-md hover:border-[#0C2461]/20 transition group">
      <p class="text-xs text-gray-400 uppercase tracking-wide mb-1">System</p>
      <p class="text-sm font-semibold text-gray-900 group-hover:text-[#0C2461]">Settings</p>
    </a>
  </div>
</div>
{% endblock %}
