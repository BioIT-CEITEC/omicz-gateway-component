{# OmiCZ logo (static/images/logo.svg), inlined so its colours follow the light / dark theme.
   Set logo_id when the logo appears more than once on a page, so the mask ids stay unique. #}
{% set _lid = logo_id | default("main") %}
<style>
  .omicz-logo .logo-red   { stroke: #D7141A; }
  .omicz-logo .logo-blue  { stroke: #1466B8; }
  .omicz-logo .logo-navy  { stroke: #11457E; }
  .omicz-logo .logo-navy-fill { fill: #11457E; }
  .omicz-logo .logo-label { fill: #11457E; }
  html.dark .omicz-logo .logo-red   { stroke: #F0474C; }
  html.dark .omicz-logo .logo-blue  { stroke: #4C9BE8; }
  html.dark .omicz-logo .logo-navy  { stroke: #E2E8F0; }
  html.dark .omicz-logo .logo-navy-fill { fill: #E2E8F0; }
  html.dark .omicz-logo .logo-label { fill: #CBD5E1; }
</style>
<svg class="omicz-logo w-full h-auto" xmlns="http://www.w3.org/2000/svg" viewBox="24 44 516 178" role="img" aria-label="OmiCZ Gateway">
  <defs>
    <mask id="logo-red-weave-{{ _lid }}" maskUnits="userSpaceOnUse" x="76" y="62" width="56" height="92">
      <rect x="76" y="62" width="56" height="92" fill="white"/>
      <circle cx="104" cy="125.556" r="8" fill="black"/>
    </mask>
    <mask id="logo-blue-weave-{{ _lid }}" maskUnits="userSpaceOnUse" x="76" y="62" width="56" height="92">
      <rect x="76" y="62" width="56" height="92" fill="white"/>
      <circle cx="104" cy="94.444" r="8" fill="black"/>
    </mask>
  </defs>
  <g fill="none" stroke-linecap="round">
    <path class="logo-red" stroke-width="15" d="M92 59.404 A52 52 0 0 0 92 160.596"/>
    <path class="logo-blue" stroke-width="15" d="M116 59.404 A52 52 0 0 1 116 160.596"/>
    <path class="logo-red" stroke-width="9.5" mask="url(#logo-red-weave-{{ _lid }})" d="M87 78 C87 92.222 121 95.778 121 110 C121 124.222 87 127.778 87 142"/>
    <path class="logo-blue" stroke-width="9.5" mask="url(#logo-blue-weave-{{ _lid }})" d="M121 78 C121 92.222 87 95.778 87 110 C87 124.222 121 127.778 121 142"/>
    <path class="logo-navy" stroke-width="16" stroke-linejoin="round" d="M190 158 V112 C190 78 236 78 236 111 V158 M236 111 C236 78 282 78 282 111 V158"/>
    <path class="logo-blue" stroke-width="15" d="M423.568 77.862 A46 46 0 1 0 423.568 148.338"/>
    <path class="logo-red" stroke-width="15" stroke-linejoin="round" d="M453 67.1 H528 L451 159.1 H528"/>
  </g>
  <rect class="logo-navy-fill" x="307" y="88" width="16" height="78" rx="7"/>
  <circle class="logo-navy-fill" cx="315" cy="63" r="9"/>
  <text class="logo-label" x="535" y="214" text-anchor="end" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="44" font-weight="600" letter-spacing="0.5">Gateway</text>
</svg>
