{% extends "base.html" %} {% block title %}New Sequencer Type{% endblock %} {%
block content %}
<div class="mb-6">
  <a href="/sequencers-types/" class="text-sm text-indigo-600 hover:underline"
    >&larr; Back to sequencer types</a
  >
</div>

<div class="bg-white rounded-xl shadow p-8 max-w-lg">
  <h1 class="text-xl font-bold text-gray-900 mb-6">New Sequencer Type</h1>

  {% if error %}
  <div
    class="mb-4 bg-red-50 border border-red-200 text-red-700 text-sm rounded-lg px-4 py-3"
  >
    {{ error }}
  </div>
  {% endif %}

  <form method="POST" action="/sequencers-types/create" class="space-y-4">
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Name</label>
      <input
        type="text"
        name="name"
        required
        class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400"
        placeholder="Illumina NovaSeq"
      />
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1"
        >Completion Signal</label
      >
      <input
        type="text"
        name="completion_signal"
        required
        class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400"
        placeholder="RTAComplete.txt"
      />
      <p class="text-xs text-gray-400 mt-1">
        Filename (or prefix) that marks a run as complete.
      </p>
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1"
        >Signal Match</label
      >
      <select
        name="signal_match"
        class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400"
      >
        <option value="exact">Exact — filename must match exactly</option>
        <option value="prefix">
          Prefix — filename must start with the signal
        </option>
        <option value="suffix">
          Suffix — filename must end with the signal
        </option>
      </select>
    </div>

    <button
      type="submit"
      class="w-full bg-indigo-600 text-white py-2 rounded-lg text-sm font-medium hover:bg-indigo-700 transition"
    >
      Create Sequencer Type
    </button>
  </form>
</div>
{% endblock %}
