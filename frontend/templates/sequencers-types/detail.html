{% extends "base.html" %} {% block title %}{{ st.name }}{% endblock %} {% block
content %}
<div class="mb-6">
  <a href="/sequencers-types/" class="text-sm text-indigo-600 hover:underline"
    >&larr; Back to sequencer types</a
  >
</div>

<div class="bg-white rounded-xl shadow p-8 max-w-2xl">
  <div class="flex items-start justify-between mb-6">
    <div>
      <h1 class="text-2xl font-bold text-gray-900">{{ st.name }}</h1>
      <p class="text-sm text-gray-400 mt-1">{{ st.completion_signal }}</p>
      <p class="text-sm text-gray-400 mt-1">{{ st.signal_match }}</p>
    </div>
  </div>

  <dl class="grid grid-cols-2 gap-4 text-sm mb-8">
    <div>
      <dt class="text-gray-400 font-medium">ID</dt>
      <dd class="text-gray-800 mt-1">{{ st.uuid }}</dd>
    </div>
  </dl>

  <div class="flex gap-3">
    <a
      href="/sequencers-types/{{ st.uuid }}/edit"
      class="bg-indigo-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-indigo-700 transition"
    >
      Edit
    </a>
    <form
      method="POST"
      action="/sequencers-types/{{ st.uuid }}/delete"
      onsubmit="return confirm('Delete this sequencer type?');"
    >
      <button
        type="submit"
        class="bg-red-100 text-red-600 px-4 py-2 rounded-lg text-sm font-medium hover:bg-red-200 transition"
      >
        Delete
      </button>
    </form>
  </div>
</div>
{% endblock %}
