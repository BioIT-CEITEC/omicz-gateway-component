{% extends "base.html" %}
{% block title %}Edit {{ st.name }}{% endblock %}

{% block content %}
<div class="mb-6">
    <a href="/sequencers-types/{{ st.uuid }}" class="text-sm text-indigo-600 hover:underline">&larr; Back</a>
</div>

<div class="bg-white rounded-xl shadow p-8 max-w-lg">
    <h1 class="text-xl font-bold text-gray-900 mb-6">Edit Sequencer Type</h1>

    {% if error %}
    <div class="mb-4 bg-red-50 border border-red-200 text-red-700 text-sm rounded-lg px-4 py-3">
        {{ error }}
    </div>
    {% endif %}

    <form method="POST" action="/sequencers-types/{{ st.uuid }}/edit" class="space-y-4">

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Name</label>
            <input type="text" name="name" required
                   value="{{ st.name }}"
                   class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400" />
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Completion Signal</label>
            <input type="text" name="completion_signal" required
                   value="{{ st.completion_signal }}"
                   class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400" />
            <p class="text-xs text-gray-400 mt-1">Filename (or prefix) that marks a run as complete.</p>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Signal Match</label>
            <select name="signal_match"
                    class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400">
                <option value="exact" {% if st.signal_match == "exact" %}selected{% endif %}>Exact — filename must match exactly</option>
                <option value="prefix" {% if st.signal_match == "prefix" %}selected{% endif %}>Prefix — filename must start with the signal</option>
            </select>
        </div>

        <button type="submit"
                class="w-full bg-indigo-600 text-white py-2 rounded-lg text-sm font-medium hover:bg-indigo-700 transition">
            Save Changes
        </button>
    </form>
</div>
{% endblock %}
