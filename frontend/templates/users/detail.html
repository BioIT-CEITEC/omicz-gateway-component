{% extends "base.html" %} {% block title %}{{ user.username }}{% endblock %} {%
block content %}
<div class="mb-6">
  <a href="/users/" class="text-sm text-indigo-600 hover:underline"
    >&larr; Back to users</a
  >
</div>

<div class="bg-white rounded-xl shadow p-8 max-w-2xl">
  <div class="flex items-start justify-between mb-6">
    <div>
      <h1 class="text-2xl font-bold text-gray-900">{{ user.username }}</h1>
      <p class="text-sm text-gray-400 mt-1">{{ user.email }}</p>
    </div>
  </div>

  <dl class="grid grid-cols-2 gap-4 text-sm mb-8">
    <div>
      <dt class="text-gray-400 font-medium">User ID</dt>
      <dd class="text-gray-800 mt-1">{{ user.uuid }}</dd>
    </div>
    <div>
      <dt class="text-gray-400 font-medium">Email</dt>
      <dd class="text-gray-800 mt-1">{{ user.email }}</dd>
    </div>
  </dl>

  <div class="flex gap-3">
    <a
      href="/users/{{ user.uuid }}/edit"
      class="bg-indigo-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-indigo-700 transition"
    >
      Edit
    </a>
    <form
      method="POST"
      action="/users/{{ user.uuid }}/delete"
      onsubmit="return confirm('Delete this user?');"
    >
      <button
        type="submit"
        class="bg-red-100 text-red-600 px-4 py-2 rounded-lg text-sm font-medium hover:bg-red-200 transition"
      >
        Delete
      </button>
    </form>
  </div>
</div>
{% endblock %}
