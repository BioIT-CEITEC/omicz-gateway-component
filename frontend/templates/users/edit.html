{% extends "base.html" %}
{% block title %}Edit {{ user.username }}{% endblock %}

{% block content %}
<div class="mb-6">
    <a href="/users/{{ user.uuid }}" class="text-sm text-indigo-600 hover:underline">&larr; Back</a>
</div>

<div class="bg-white rounded-xl shadow p-8 max-w-lg">
    <h1 class="text-xl font-bold text-gray-900 mb-6">Edit User</h1>

    {% if error %}
    <div class="mb-4 bg-red-50 border border-red-200 text-red-700 text-sm rounded-lg px-4 py-3">
        {{ error }}
    </div>
    {% endif %}

    <form method="POST" action="/users/{{ user.uuid }}/edit" class="space-y-4">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
            <input type="text" name="username" required minlength="3"
                   value="{{ user.username }}"
                   class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400" />
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
            <input type="email" name="email" required
                   value="{{ user.email }}"
                   class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400" />
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">
                New Password
                <span class="text-gray-400 font-normal">(leave blank to keep current)</span>
            </label>
            <input type="password" name="password" minlength="6"
                   class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400" />
        </div>

        <button type="submit"
                class="w-full bg-indigo-600 text-white py-2 rounded-lg text-sm font-medium hover:bg-indigo-700 transition">
            Save Changes
        </button>
    </form>
</div>
{% endblock %}
